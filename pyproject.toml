[project]
name = "fpl-analytics-engine"
version = "0.1.1"
description = "A football analytics engine processing Premier League data to identify team and player form trends and performance insights."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Isaac Cheng", email = "47993930+IsaacCheng9@users.noreply.github.com" },
]
dependencies = ["fastapi>=0.116.1", "requests>=2.32.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_analytics_engine"]

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-cov>=6.2.1"]

[tool.commitizen]
version = "0.1.1"
version_files = [
    "pyproject.toml:version",
    "pyproject.toml:tool.commitizen.version",
]
