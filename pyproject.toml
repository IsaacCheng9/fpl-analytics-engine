[project]
name = "fpl-analytics-engine"
version = "0.24.0"
description = "A football analytics engine processing Premier League data to identify team and player form trends and performance insights."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Isaac Cheng", email = "47993930+IsaacCheng9@users.noreply.github.com" },
]
dependencies = [
    "fastapi>=0.116.1",
    "polars>=1.41.0",
    "requests>=2.32.4",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_analytics_engine"]

[tool.vercel]
entrypoint = "src.fpl_analytics_engine.vercel:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.11.0",
    "ty",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "D"]
# The Google docstring convention disables D401, so re-enable it to enforce
# imperative summaries (e.g. 'Fetch', not 'Fetches').
extend-select = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Avoid enforcing docstrings in test files.
"tests/**" = ["D"]

[tool.commitizen]
version = "0.24.0"
version_files = [
    "pyproject.toml:version",
    "pyproject.toml:tool.commitizen.version",
]
