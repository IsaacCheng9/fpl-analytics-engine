name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests with Pytest
        run: uv run --locked pytest -v --cov=src/fpl_analytics_engine --cov-report=term-missing

      - name: Validate committed data snapshots
        run: uv run --locked python -m fpl_analytics_engine.data_health

      - name: Run the real-data smoke check
        run: uv run --locked python -m fpl_analytics_engine.smoke
