name: Type Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Type check with Pyrefly
        run: uv run pyrefly check
